[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-rl"
version = "0.1.0"
description = "Joint production scheduling, machine maintenance and demand-peak research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "gymnasium>=1.0,<1.3", "torch>=2.8,<3", "stable-baselines3>=2.8,<3", "sb3-contrib>=2.8,<3", "ortools>=9.10,<10", "pandas>=2.0,<3", "matplotlib>=3.9,<4", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
factory-rl = "factory_rl.cli:main"

[tool.setuptools.packages.find]
include = ["factory_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
